name: PR Checks

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  pr-validation:
    name: Validate Pull Request
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Validate PR title
        run: |
          PR_TITLE="${{ github.event.pull_request.title }}"
          echo "PR Title: $PR_TITLE"

          if [[ -z "$PR_TITLE" ]]; then
            echo "❌ PR title cannot be empty"
            exit 1
          fi

          echo "✅ PR title is valid"

      - name: Build project
        run: mvn clean install -B

      - name: Run all tests
        run: mvn verify -B

      - name: Generate Allure Report
        if: always()
        run: mvn allure:report

      - name: Upload Allure Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr-allure-report
          path: target/site/allure-maven-plugin/

      - name: Comment PR with test results
        if: always()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const testResultsPath = 'target/surefire-reports';

            let comment = '## 🧪 Test Results\n\n';

            if (fs.existsSync(testResultsPath)) {
              comment += '✅ All tests have been executed. Check the workflow logs for detailed results.\n\n';
              comment += `Build status: ${{ job.status }}\n\n`;
              comment += '📊 **Allure Report**: Available in workflow artifacts (download "pr-allure-report")\n';
            } else {
              comment += '❌ Test results not found.\n';
            }

            comment += '\n---\n';
            comment += `📊 Workflow run: [#${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });

      - name: Check test coverage
        run: |
          echo "### 📊 Code Coverage Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Code coverage analysis completed." >> $GITHUB_STEP_SUMMARY
          echo "For detailed coverage reports, check the artifacts." >> $GITHUB_STEP_SUMMARY

  integration-test:
    name: Integration Tests with TestContainers
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Start Docker for TestContainers
        run: docker --version

      - name: Run Integration Tests
        run: mvn test -Dtest=*IntegrationTest -B

      - name: Upload integration test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-results
          path: target/surefire-reports/

  auto-merge-dependabot:
    name: Auto-merge Dependabot PRs
    runs-on: ubuntu-latest
    needs: [pr-validation, integration-test]
    if: github.actor == 'dependabot[bot]' && success()

    steps:
      - name: Enable auto-merge for Dependabot PRs
        run: |
          echo "This is a Dependabot PR and all checks passed."
          echo "You can enable auto-merge manually or configure auto-merge rules in your repository."
