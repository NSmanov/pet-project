spring:
  datasource:
    url: jdbc:tc:postgresql:17:///testdb
    driver-class-name: org.testcontainers.jdbc.ContainerDatabaseDriver

  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    com.example.taskmanagement: DEBUG
    org.springframework.test: INFO
    org.testcontainers: INFO
